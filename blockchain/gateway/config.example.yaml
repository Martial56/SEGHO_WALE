# Configuration d'une instance de la passerelle, pour l'organisation
# CentreSante (celle utilisée par blockchain_bridge côté Django). Copier vers
# config.yaml et adapter les chemins une fois blockchain/network/generate.sh
# exécuté (crypto-config/ généré). Une instance distincte (autre fichier,
# autre port) est nécessaire par organisation si VerificationFacture/Regulateur
# doivent aussi appeler le réseau directement.

org_msp_id: CentreSanteMSP
peer_endpoint: localhost:7051
gateway_peer: peer0.centresante.wale-sante.local
peer_tls_ca_cert: ../network/crypto-config/peerOrganizations/centresante.wale-sante.local/peers/peer0.centresante.wale-sante.local/tls/ca.crt
cert_path: ../network/crypto-config/peerOrganizations/centresante.wale-sante.local/users/User1@centresante.wale-sante.local/msp/signcerts/cert.pem
key_path: ../network/crypto-config/peerOrganizations/centresante.wale-sante.local/users/User1@centresante.wale-sante.local/msp/keystore
channel_name: canal-sante
chaincode_name: dossier-medical
listen_address: ":8090"
