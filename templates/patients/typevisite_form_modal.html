{% comment %}
Formulaire d'un type de visite (CPN), tel qu'il apparaît dans la modale de la
liste. Pendant de typevisitecurative_form_modal.html.

Pas de <script> ici : le fragment est injecté par innerHTML, un script ne s'y
exécuterait pas. L'envoi et le rechargement sont assurés par mdBindConfigForm
(medecins/config/includes/_config_modal.html).
{% endcomment %}
<form method="post" id="mdcfgConfigForm" data-url="{{ request.path }}" novalidate>
{% csrf_token %}

<div class="mdcfg-modal-body">

  {% if form.non_field_errors %}
  <div class="field-error" style="margin-bottom:14px;">{{ form.non_field_errors.0 }}</div>
  {% endif %}

  <div class="form-field">
    <label class="field-label" for="{{ form.nom.id_for_label }}">Nom du type de visite <span class="required-star">*</span></label>
    {{ form.nom }}
    {% if form.nom.errors %}<div class="field-error">{{ form.nom.errors.0 }}</div>{% endif %}
  </div>

  <div class="form-field">
    <label class="field-label" for="{{ form.code.id_for_label }}">Code <span class="required-star">*</span></label>
    {{ form.code }}
    {% if form.code.errors %}<div class="field-error">{{ form.code.errors.0 }}</div>{% endif %}
    <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">
      Identifiant technique repris dans les filtres des rendez-vous et lu par les
      rapports. Le modifier sur un type déjà utilisé faussera leur comptage.
    </div>
  </div>

  <div class="form-field">
    <label class="field-label" for="{{ form.description.id_for_label }}">Description</label>
    {{ form.description }}
    {% if form.description.errors %}<div class="field-error">{{ form.description.errors.0 }}</div>{% endif %}
  </div>

  <div class="form-field" style="display:flex;align-items:center;gap:8px;">
    {{ form.actif }}
    <label for="{{ form.actif.id_for_label }}" style="font-size:13px;font-weight:400;color:var(--text);margin:0;">
      Type de visite actif
    </label>
  </div>

</div>

<div class="mdcfg-modal-footer">
  <button type="button" class="btn-form-cancel" onclick="mdCloseConfigModal()">Annuler</button>
  <button type="submit" class="btn-form-submit">{% if edit %}Enregistrer{% else %}Créer{% endif %}</button>
</div>

</form>
