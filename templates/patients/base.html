{% extends 'base.html' %}
{% load i18n static %}

{% block topbar_title %}Patients{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
<style>
    .content { padding-top: 0 !important; }
    .patient-card { cursor: pointer; transition: all 0.2s; }
    .patient-card:hover { transform: translateY(-2px); }

    /* ── Dropdown dans la nav patients ── */
    .o-nav-dd { position: relative; display: inline-flex; align-items: stretch; }
    .o-nav-dd-trigger { cursor: pointer; user-select: none; }
    .o-nav-dd-panel {
      display: none; position: absolute; top: 100%; left: 0;
      background: #fff; border: 1px solid #dde3ec;
      border-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,0.16);
      min-width: 200px; padding: 5px 0; z-index: 9999;
    }
    .o-nav-dd:hover .o-nav-dd-panel { display: block; }
    .o-nav-dd-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; font-size: 12.5px; color: var(--text);
      text-decoration: none; transition: background 0.1s; white-space: nowrap;
    }
    .o-nav-dd-item:hover { background: var(--teal-50); color: var(--accent-text-soft); }
    .o-nav-dd-item.active { background: var(--teal-50); color: var(--accent-text-soft); font-weight: 600; }
    html[data-theme="dark"] .o-nav-dd-panel { background: var(--surface); border-color: var(--border-strong); }
    html[data-theme="dark"] .o-nav-dd-item { color: var(--text); }
    html[data-theme="dark"] .o-nav-dd-item:hover { background: rgba(var(--teal-500-rgb),0.2); color: var(--teal-300); }
    {# L'entrée de la page courante n'avait pas sa variante sombre, contrairement #}
    {# au survol juste au-dessus : elle gardait le crème de --teal-50, palier qui #}
    {# n'est pas renversé en thème sombre, sous un texte clair — donc illisible. #}
    html[data-theme="dark"] .o-nav-dd-item.active { background: rgba(var(--teal-500-rgb),0.2); color: var(--teal-300); }

    /* ── Bouton CRÉER : la couleur choisie par l'utilisateur, en sombre aussi ──
       global.css fige ce bouton sur un bleu (var(--teal-600)) en thème sombre, pour toute
       l'application : sur un accent rouge, le bouton restait bleu. Ici il reprend
       la rampe d'accent, comme en thème clair.

       Même sélecteur que la règle globale : à spécificité égale, c'est l'ordre qui
       tranche, et ce bloc est écrit après le fichier global.css.

       Fait ici, donc pour le module patients et ses pages de rendez-vous, comme
       cela a été fait pour la gynécologie. Les autres modules gardent le bleu
       jusqu'à ce qu'on les reprenne. */
    html[data-theme="dark"] .o-btn-create { background: var(--teal-500); color: #fff; }
    html[data-theme="dark"] .o-btn-create:hover { background: var(--teal-600); }

    /* ── Deux composants partagés que le thème sombre avait oubliés ──
       Le bouton d'export gardait son fond bleu très pâle, et le fil d'Ariane des
       formulaires son --teal-700 — une teinte qui n'est pas renversée en sombre
       (seuls 800/900/950 le sont), donc presque invisible sur fond sombre. */
    html[data-theme="dark"] .o-btn-excel {
      background: var(--surface-muted); border-color: var(--border); color: var(--teal-300);
    }
    html[data-theme="dark"] .o-btn-excel:hover {
      background: var(--teal-600); border-color: var(--teal-600); color: #fff;
    }
    html[data-theme="dark"] .action-bar-breadcrumb a { color: var(--teal-300); }

    /* ── Trois composants partagés figés sur un bleu en thème sombre ──
       Même cas que le bouton CRÉER : la règle sombre est écrite en dur dans
       global.css ou base.html, pour toute l'application. Reprise ici sur la rampe
       d'accent, donc pour le module patients et ses pages de rendez-vous.

       • .btn-primary        : « Créer le dossier patient », « Enregistrer les
                               modifications », « Modifier » — tous bleus.
       • .o-page-count       : la pastille du nombre à côté du titre.
       • .tab-btn.active     : l'onglet courant des fiches et des formulaires. */
    html[data-theme="dark"] .btn-primary { background: var(--teal-600); color: #fff; }
    html[data-theme="dark"] .btn-primary:hover { background: var(--teal-700); color: #fff; }
    html[data-theme="dark"] .o-page-count {
      background: rgba(var(--teal-500-rgb),0.20); color: var(--teal-300);
    }
    html[data-theme="dark"] .tab-btn.active {
      color: var(--teal-300); border-bottom-color: var(--teal-400);
    }
</style>
<script>
  (function () {
    function syncTopbarH() {
      var topbar = document.querySelector('.topbar');
      if (topbar) {
        document.documentElement.style.setProperty('--topbar-h', topbar.getBoundingClientRect().height + 'px');
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', syncTopbarH);
    } else {
      syncTopbarH();
    }
    window.addEventListener('resize', syncTopbarH);
  })();
</script>
{% endblock %}

{% block module_navbar %}
{% include 'patients/includes/nav.html' %}
{% endblock %}

{% block breadcrumb %}{% endblock %}
