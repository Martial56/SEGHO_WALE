{% comment %}
La barre de recherche du sous-en-tête, commune aux trois onglets. Le script
du socle écoute `#dbl-q` par délégation : un seul champ, un seul comportement,
et il survit à l'échange d'un onglet.
{% endcomment %}
<div class="o-search-bar">
  <input type="search" id="dbl-q" class="o-search-input" value="{{ q }}"
         placeholder="{{ placeholder }}" autocomplete="off">
  <button type="button" class="o-search-btn" aria-label="Chercher"
          onclick="dblChercher()"><i class="bi bi-search"></i></button>
</div>
