{% comment %}Styles communs des écrans de caisse. Les couleurs viennent des
variables du thème (base.html) : le mode sombre suit sans règle de plus.{% endcomment %}
<style>
/* Toute la largeur, comme les autres modules : une page bornée et centrée
   laissait une large marge vide de chaque côté sur un grand écran. */
.cpt-page { padding: 18px 20px 40px; }
/* Formulaire court (ouverture de caisse, don, règlement…) : il garde une
   largeur lisible, centrée, plutôt que des champs étirés sur tout l'écran. */
.cpt-page.cpt-etroite { margin: 0 auto; }
.cpt-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.cpt-title { font-size: 18px; font-weight: 800; color: var(--text); margin: 0; }
.cpt-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
.cpt-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.cpt-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
.cpt-card h2 { font-size: 13px; font-weight: 700; color: var(--text); margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; }

.cpt-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
.cpt-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.cpt-kpi .l { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
.cpt-kpi .v { font-size: 20px; font-weight: 800; color: var(--text); margin-top: 4px; font-variant-numeric: tabular-nums; }
.cpt-kpi .s { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.cpt-kpi.accent { border-color: var(--teal-500); background: rgba(var(--teal-500-rgb), .06); }

.cpt-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.cpt-table th { text-align: left; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.cpt-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
.cpt-table tr:last-child td { border-bottom: none; }
.cpt-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cpt-table tfoot td { font-weight: 800; border-top: 2px solid var(--border); }
.cpt-table tr.lien { cursor: pointer; }
.cpt-table tr.lien:hover td { background: var(--teal-50); }
html[data-theme="dark"] .cpt-table tr.lien:hover td { background: rgba(255,255,255,.04); }

.cpt-badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.cpt-badge.ouverte { background: rgba(22,169,107,.12); color: #0f8f59; }
.cpt-badge.cloturee { background: rgba(217,147,15,.14); color: #a8710a; }
.cpt-badge.validee { background: rgba(47,127,214,.13); color: #2069b8; }
.ecart-neg { color: var(--rose-text, #c0392b); font-weight: 700; }
.ecart-pos { color: #a8710a; font-weight: 700; }
.ecart-nul { color: #0f8f59; font-weight: 700; }

.cpt-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 7px; font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; }
.cpt-btn:hover { border-color: var(--teal-500); }
.cpt-btn.primaire { background: var(--teal-600); border-color: var(--teal-600); color: #fff; }
.cpt-btn.primaire:hover { background: var(--teal-700); }
.cpt-btn.danger { border-color: rgba(192,57,43,.4); color: var(--rose-text, #c0392b); }

.cpt-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.cpt-field label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
.cpt-input, .cpt-textarea { padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--bg); color: var(--text); font-family: inherit; }
.cpt-input:focus, .cpt-textarea:focus { outline: none; border-color: var(--teal-500); }
.cpt-textarea { min-height: 70px; resize: vertical; }
.cpt-note { font-size: 12px; color: var(--text-muted); }
.cpt-alerte { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; background: rgba(217,147,15,.1); border: 1px solid rgba(217,147,15,.35); color: var(--text); }
.cpt-vide { padding: 26px; text-align: center; color: var(--text-muted); font-size: 13px; }
.cpt-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 800px) { .cpt-grid2 { grid-template-columns: 1fr; } }
</style>
