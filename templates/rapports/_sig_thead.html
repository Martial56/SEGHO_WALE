{% comment %}
En-tête d'un tableau du rapport SIG : une colonne par tranche d'âge (F et M
réunis), puis TOTAL et CAS REFERES. Paramètre : titre (libellé de la
première colonne).
{% endcomment %}
<thead>
  <tr>
    <th class="rmg-label-col">{{ titre }}</th>
    {% for cle, label in brackets %}<th>{{ label }}</th>{% endfor %}
    <th class="rmg-total">TOTAL</th>
    <th>CAS REFERES</th>
  </tr>
</thead>
