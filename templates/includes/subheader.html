{% load static %}
<style>
  /* ── DARK MODE ── */
  html[data-theme="dark"] .o-list tbody tr:hover { background: rgba(var(--teal-500-rgb), 0.2); }
  html[data-theme="dark"] .o-list thead th:hover { background: var(--surface); }
  html[data-theme="dark"] .o-list thead th { background: var(--surface); }
  html[data-theme="dark"] .o-search-input { color: var(--text); }
  html[data-theme="dark"] .o-search-bar { border-bottom-color: var(--border-strong); }
  html[data-theme="dark"] .o-ctrl-btn { color: var(--text-muted); }
  html[data-theme="dark"] .o-ctrl-btn:hover { background: var(--surface); color: var(--text); border-color: var(--border); }
  html[data-theme="dark"] .o-pag-btn { background: var(--surface); border-color: var(--border); color: var(--text-muted); }
  html[data-theme="dark"] .o-view-btn { background: var(--surface); color: var(--text-muted); border-color: var(--border); }
  /* Sans ce rappel, la regle sombre ci-dessus (plus specifique que
     .o-view-btn.active) effacait la couleur du bouton de vue actif. */
  html[data-theme="dark"] .o-view-btn.active,
  html[data-theme="dark"] .o-view-btn:hover { background: var(--teal-600); color: #fff; }
  html[data-theme="dark"] .o-view-btns { border-color: var(--border); }
  html[data-theme="dark"] .o-ctrl-sep { background: var(--border); }
  html[data-theme="dark"] .o-empty-state { background: var(--bg); }
  html[data-theme="dark"] .o-empty-illo { background: linear-gradient(135deg, var(--teal-700) 0%, var(--teal-500) 100%); }

  /* ══ SUBHEADER ══ */
  .o-subheader {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 6px 16px; display: flex; flex-direction: column; gap: 5px;
    position: sticky; top: 0; z-index: 190;
    margin: 0 -32px 0;
  }
  .o-subheader-row { display: flex; align-items: center; gap: 8px; }
  .o-subheader-row-right { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .o-page-title { font-size: 17px; font-weight: 400; color: var(--text); }
  .o-btn-create {
    background: var(--teal-500); color: #fff; border: none; padding: 5px 14px; border-radius: 4px;
    font-size: 12.5px; font-weight: 500; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
    letter-spacing: 0.5px; transition: background 0.15s;
  }
  .o-btn-create:hover { background: var(--teal-600); }
  .o-btn-excel {
    width: 28px; height: 28px; border: 1px solid var(--teal-200); border-radius: 4px;
    background: #f0f5fa; color: var(--accent-text); font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none; transition: background 0.15s, border-color 0.15s;
  }
  .o-btn-excel:hover { background: var(--teal-700); color: #fff; border-color: var(--teal-700); }
  .o-search-bar {
    display: flex; align-items: center; border: none; border-bottom: 1px solid #bbb;
    background: transparent; min-height: 28px; padding: 2px 4px; gap: 4px; width: 320px;
  }
  .o-search-input {
    border: none; outline: none; font-size: 12px;
    color: var(--text); flex: 1; min-width: 60px; background: transparent;
  }
  .o-search-btn { background: none; border: none; cursor: pointer; color: #888; font-size: 13px; padding: 2px; }
  .o-ctrl-btn {
    background: none; border: 1px solid transparent; border-radius: 4px;
    padding: 4px 8px; font-size: 12px;
    color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 4px;
    transition: border-color 0.15s, color 0.15s, background 0.15s; white-space: nowrap;
  }
  .o-ctrl-btn:hover { border-color: var(--border); color: var(--text); background: #f3f3f3; }
  .o-ctrl-sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; }
  .o-pagination { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .o-pag-btn {
    width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 3px;
    background: var(--surface); display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); text-decoration: none; font-size: 12px;
    transition: background 0.15s, color 0.15s;
  }
  .o-pag-btn:hover { background: var(--teal-600); color: #fff; border-color: var(--teal-600); }
  .o-pag-btn.disabled { opacity: 0.35; pointer-events: none; }
  .o-view-btns { display: flex; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
  .o-view-btn {
    width: 26px; height: 24px; border: none; background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 13px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .o-view-btn:not(:last-child) { border-right: 1px solid var(--border); }
  .o-view-btn.active, .o-view-btn:hover { background: var(--teal-600); color: #fff; }

  /* ══ LIST TABLE ══ */
  .o-list-wrap {
    overflow-x: auto; overflow-y: auto; background: var(--surface);
    margin: 0 -32px;
    scrollbar-width: none;
  }
  .o-list-wrap::-webkit-scrollbar { display: none; }
  .o-list { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
  .o-list thead th {
    background: #f5f5f5; border-bottom: 1px solid var(--border);
    padding: 6px 10px; font-weight: 500; font-size: 11.5px;
    color: var(--text-muted); text-align: left;
    position: sticky; top: 0; z-index: 2; cursor: pointer; user-select: none;
    white-space: normal; line-height: 1.3;
  }
  .o-list thead th:hover { background: #f5f5f5; }
  .o-list thead th.th-center { text-align: center; }
  .o-col-resize {
    position: absolute; right: 0; top: 0; bottom: 0; width: 5px;
    cursor: col-resize; user-select: none; background: transparent; z-index: 2;
  }
  .o-col-resize:hover, .o-col-resize.active { background: var(--teal-500); opacity: 0.45; }
  .o-list tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.1s; cursor: pointer; }
  .o-list tbody tr:hover { background: var(--teal-50); }
  .o-list tbody td { padding: 5px 10px; color: var(--text); vertical-align: middle; }
  .o-list tbody td.td-center { text-align: center; }
  .o-list tbody td.td-muted { color: #ddd; text-align: center; font-size: 10px; }
  .o-list tbody td.td-code { color: var(--teal-500); font-weight: 500; font-size: 12px; }
  .o-list tbody td.td-name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .o-list tbody td.td-doctor { max-width: 130px; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); }
  .o-list tbody td.td-type { max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  .o-list tbody td.td-diagnostic { max-width: 200px; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); }

  /* Checkbox col */

  /* Empty state */
  .o-empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 20px;
  }
  .o-empty-illo {
    width: 88px; height: 88px; border-radius: 50%;
    background: linear-gradient(135deg, var(--teal-600) 0%, var(--teal-400) 100%);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px; position: relative;
  }
  .o-empty-illo svg { color: #fff; opacity: 0.9; }
  .o-empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .o-empty-sub { font-size: 12.5px; color: var(--text-muted); margin-bottom: 20px; }
  .o-empty-btn {
    background: var(--teal-500); color: #fff; border: none; padding: 7px 20px; border-radius: 4px;
    font-size: 12.5px; font-weight: 500;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.15s;
  }
  .o-empty-btn:hover { background: var(--teal-600); }

  /* ══ DROPDOWNS ══ */
  .o-dd-wrap { position: relative; }
  .o-dd-panel {
    display: none; position: fixed; z-index: 9999;
    background: #fff; border: 1px solid #dde3ec;
    border-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,0.16);
    min-width: 230px; padding: 5px 0;
  }
  .o-dd-panel.open { display: block; }
  .o-dd-section {
    padding: 6px 14px 3px; font-size: 10px; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .o-dd-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 14px; font-size: 12.5px; color: var(--text);
    cursor: pointer; text-decoration: none; transition: background 0.1s;
    white-space: nowrap; gap: 10px; position: relative;
  }
  .o-dd-item:hover { background: var(--teal-50); color: var(--accent-text-soft); }
  .o-dd-item.active { background: #ede7f6; color: var(--accent-text-soft); font-weight: 500; }
  .o-dd-sep { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
  /* Sous-menus, flèches et rappels de valeur : fournis par
     includes/listing/styles.html, inclus en fin de ce bloc. */

  /* Active filter tag */
  .o-active-filters { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .o-filter-tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--teal-50); color: var(--accent-text-soft); border: 1px solid #b2d8db;
    border-radius: 3px; padding: 1px 8px; font-size: 11.5px; font-weight: 500;
  }
  .o-filter-tag button {
    background: none; border: none; cursor: pointer; color: #999;
    font-size: 14px; line-height: 1; padding: 0; margin-left: 2px;
  }
  .o-filter-tag button:hover { color: #333; }

  /* Date block inside filter dropdown */
  .o-dd-date-block { padding: 8px 14px 10px; }
  .o-dd-date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .o-dd-date-row label { font-size: 11.5px; color: var(--text-muted); min-width: 18px; }
  .o-dd-date-input {
    flex: 1; border: none; border-bottom: 1px solid #bbb; background: transparent;
    font-size: 12px; color: var(--text); padding: 2px 2px; outline: none;
  }
  .o-dd-date-input:focus { border-bottom-color: var(--teal-600); }
  .o-dd-date-actions { display: flex; gap: 6px; margin-top: 10px; }
  .o-dd-apply-btn {
    flex: 1; background: var(--teal-600); color: #fff; border: none; border-radius: 3px;
    padding: 5px 0; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: background 0.15s;
  }
  .o-dd-apply-btn:hover { background: var(--teal-700); }
  .o-dd-clear-btn {
    background: none; border: 1px solid var(--border); border-radius: 3px;
    padding: 5px 10px; font-size: 11.5px; color: var(--text-muted);
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
    transition: border-color 0.15s, color 0.15s;
  }
  .o-dd-clear-btn:hover { border-color: #999; color: var(--text); }

  {# Menus : mêmes surfaces que le reste de l'application, pas un brun à part. #}
  html[data-theme="dark"] .o-dd-panel, html[data-theme="dark"] .o-dd-sub { background: var(--surface); border-color: var(--border); }
  html[data-theme="dark"] .o-dd-item:hover { background: rgba(var(--teal-500-rgb), 0.2); color: var(--text-strong); }
  html[data-theme="dark"] .o-dd-item.active { background: rgba(var(--teal-500-rgb), 0.3); color: var(--teal-300); }
  html[data-theme="dark"] .o-filter-tag { background: rgba(var(--teal-500-rgb), 0.25); border-color: rgba(var(--teal-500-rgb), 0.5); color: var(--teal-300); }
  html[data-theme="dark"] .o-dd-date-input { border-bottom-color: var(--border-strong); color: var(--text); }
  html[data-theme="dark"] .o-dd-clear-btn { border-color: var(--border); color: var(--text-muted); }

  /* Portée affichée (période) : information, pas un contrôle — donc ni curseur
     de clic ni couleur d'accent, pour ne pas donner envie de l'effacer. */
  .o-page-scope {
    margin-left: 7px; font-size: 12px; font-weight: 400;
    color: var(--text-muted); text-transform: none; letter-spacing: normal;
  }
  html[data-theme="dark"] .o-page-scope { color: rgba(255,255,255,.45); }

  /* ── En-têtes de groupe repliables ──
     Pas de display:flex sur la cellule : elle sortirait de la mise en page du
     tableau et son colspan serait ignoré (la bande ne couvrirait qu'une
     colonne). Le chevron doit être inline-block, sinon son transform de
     rotation ne s'applique pas. */
  tr.o-group-header { cursor: pointer; }
  tr.o-group-header td {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
    color: var(--accent-text); background: rgba(0,0,0,.02);
    padding: 8px 14px; vertical-align: middle;
  }
  tr.o-group-header:hover td { background: var(--teal-50); }
  tr.o-group-header .group-chevron {
    display: inline-block; margin-right: 6px; font-size: 10px; transition: transform .15s;
  }
  tr.o-group-header.open .group-chevron { transform: rotate(90deg); }
  tr.o-group-header .group-count {
    margin-left: 8px; font-size: 10.5px; font-weight: 600;
    color: var(--text-muted); text-transform: none; letter-spacing: normal;
  }
  html[data-theme="dark"] tr.o-group-header td { color: var(--teal-300); background: rgba(255,255,255,.03); }
  html[data-theme="dark"] tr.o-group-header:hover td { background: rgba(var(--teal-500-rgb), .12); }

  /* Entrée de menu laissée sans champ métier associé */
  .o-dd-item-inactif { color: var(--text-faint); opacity: .55; cursor: not-allowed; }
  .o-dd-item-inactif:hover { background: none; }
</style>
{% include 'includes/listing/styles.html' %}

<!-- ══ SUBHEADER ══ -->
<div class="o-subheader"{% if subheader_sticky_top %} style="top: {{ subheader_sticky_top }};"{% endif %}>

  <!-- Ligne 1 : titre + recherche -->
  <div class="o-subheader-row">
    {% include 'includes/subheader_title.html' %}
    <div class="o-subheader-row-right">
      <form method="get" style="display:flex;align-items:center;" onsubmit="return false;">
        <div class="o-search-bar">
          <input class="o-search-input" type="text" name="q" id="search-q"
                 value="{{ q }}"
                 placeholder="{{ subheader_placeholder|default:'Rechercher...' }}">
          <button type="button" class="o-search-btn" id="clear-search-btn" title="Effacer la recherche"
                  onclick="clearSearch()" style="{% if not q %}display:none;{% endif %}">
            <i class="bi bi-x-lg"></i>
          </button>
          <button type="submit" class="o-search-btn"><i class="bi bi-search"></i></button>
        </div>
      </form>
    </div>
  </div>

  {% include 'includes/subheader_controls.html' %}

</div>

<script src="{% static 'js/listing_groupes.js' %}"></script>
<script>
  // Colonnes redimensionnables
  function initResizableCols(table) {
    var ths = table.querySelectorAll('thead th');
    ths.forEach(function(th) {
      var h = document.createElement('div');
      h.className = 'o-col-resize';
      th.appendChild(h);
      h.addEventListener('mousedown', function(e) {
        e.preventDefault(); e.stopPropagation();
        var startX = e.pageX, startW = th.offsetWidth;
        h.classList.add('active');
        ths.forEach(function(t) { t.style.width = t.offsetWidth + 'px'; });
        table.style.tableLayout = 'fixed';
        function onMove(e) { th.style.width = Math.max(40, startW + e.pageX - startX) + 'px'; }
        function onUp() { h.classList.remove('active'); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  }
  // Appelé après le rendu DOM complet (la table est après cet include)

  // Rebranché après chaque échange AJAX : les lignes du tableau sont remplacées,
  // leurs écouteurs d'origine disparaissent avec elles.
  function initListeInteractions() {
    // Le constructeur de conditions vit dans la barre de contrôles, remplacée à
    // chaque échange : ses lignes sont donc à reconstruire depuis l'URL.
    if (window.lstfInit) window.lstfInit();
    document.querySelectorAll('.o-list').forEach(initResizableCols);
    document.querySelectorAll('.rdv-row').forEach(function(row) {
      row.addEventListener('click', function(e) {
        if (e.target.type === 'checkbox') return;
        if (e.target.closest('.o-group-header')) return;
        window.location = row.dataset.url;
      });
    });
  }
  if (document.readyState !== 'loading') initListeInteractions();
  else document.addEventListener('DOMContentLoaded', initListeInteractions);

  // ── Rafraîchissement AJAX ─────────────────────────────────────────────────
  // Une seule requête à la fois : enchaîner les clics annule la précédente,
  // sinon deux réponses peuvent revenir dans le désordre.
  var _rdvInFlight = null;

  function refreshList(url, pushHistory) {
    var openPanel = document.querySelector('#subheader-controls .o-dd-panel.open');
    var openPanelId = openPanel ? openPanel.id : null;

    if (_rdvInFlight) _rdvInFlight.abort();
    var ctrl = new AbortController();
    _rdvInFlight = ctrl;

    fetch(url, {headers: {'X-Requested-With': 'XMLHttpRequest'}, signal: ctrl.signal})
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var nouveauxControles = doc.getElementById('subheader-controls');
        if (nouveauxControles) {
          document.getElementById('subheader-controls').outerHTML = nouveauxControles.outerHTML;
        }
        var nouvelleListe = doc.querySelector('.o-list-wrap');
        var listeActuelle = document.querySelector('.o-list-wrap');
        if (nouvelleListe && listeActuelle) listeActuelle.innerHTML = nouvelleListe.innerHTML;
        // Le titre porte la mention de période : il est hors de la barre de
        // contrôles échangée, il faut donc le rafraîchir explicitement.
        var nouveauTitre = doc.querySelector('.o-page-title');
        var titreActuel = document.querySelector('.o-page-title');
        if (nouveauTitre && titreActuel) titreActuel.innerHTML = nouveauTitre.innerHTML;
        if (pushHistory) history.pushState({}, '', url);
        initListeInteractions();
        // La barre a été remplacée : rebrancher l'ouverture au survol.
        brancherSurvolMenus();
        // Ré-ouvre le menu qui était ouvert, pour pouvoir cumuler plusieurs clics.
        if (openPanelId) {
          var btn = document.getElementById(openPanelId === 'dd-filtres' ? 'btn-filtres' : 'btn-group');
          if (btn) toggleDd(openPanelId, btn);
        }
      })
      .catch(function(err) {
        if (err.name === 'AbortError') return;   // remplacée par une requête plus récente
        if (window.showToast) showToast('Impossible de rafraîchir la liste. Vérifiez votre connexion.', 'error');
      })
      .finally(function() { if (_rdvInFlight === ctrl) _rdvInFlight = null; });
  }
  window.refreshList = refreshList;

  // Ajoute ou retire une valeur : c'est ce qui rend filtres et regroupements cumulables.
  // Valeurs réellement appliquées pour `key`. Sur une URL sans ce paramètre, la
  // vue a pu poser un défaut (la journée en cours) : on lit alors l'état rendu
  // par le serveur, sinon le premier clic sur une entrée déjà active
  // l'ajouterait au lieu de la retirer.
  function valeursActuelles(key, params) {
    if (params.has(key)) return params.getAll(key);
    var ctrl = document.getElementById('subheader-controls');
    var brut = ctrl ? (ctrl.dataset[key === 'filter' ? 'filters' : 'groups'] || '') : '';
    return brut ? brut.split(',') : [];
  }

  // Les périodes s'excluent mutuellement : « Aujourd'hui » et « Toutes les
  // périodes » ensemble n'aurait aucun sens. Choisir l'une remplace l'autre, en
  // conservant les filtres des autres familles (état, type…).
  var PERIODES = ['today', 'semaine', 'tous'];

  function setPeriode(value) {
    var params = new URLSearchParams(window.location.search);
    var autres = valeursActuelles('filter', params).filter(function(v) {
      return PERIODES.indexOf(v) === -1;
    });
    params.delete('filter');
    autres.forEach(function(v) { params.append('filter', v); });
    params.append('filter', value);
    params.delete('page');
    refreshList(window.location.pathname + '?' + params.toString(), true);
  }
  window.setPeriode = setPeriode;

  function toggleParam(key, value) {
    var params = new URLSearchParams(window.location.search);
    var values = valeursActuelles(key, params);
    params.delete(key);
    if (values.indexOf(value) !== -1) {
      values.filter(function(v) { return v !== value; }).forEach(function(v) { params.append(key, v); });
    } else {
      values.forEach(function(v) { params.append(key, v); });
      params.append(key, value);
    }
    // Sans paramètre `filter`, la vue applique son défaut « aujourd'hui ».
    // Décocher le dernier filtre doit donc poser un marqueur explicite, sinon
    // le défaut se réappliquerait et la case semblerait bloquée.
    if (key === 'filter' && params.getAll('filter').length === 0) {
      params.append('filter', 'tous');
    }
    params.delete('page');
    refreshList(window.location.pathname + '?' + params.toString(), true);
  }
  window.toggleParam = toggleParam;

  function clearSearch() {
    var input = document.getElementById('search-q');
    var btn = document.getElementById('clear-search-btn');
    if (input) input.value = '';
    if (btn) btn.style.display = 'none';
    var params = new URLSearchParams(window.location.search);
    params.delete('q'); params.delete('page');
    refreshList(window.location.pathname + (params.toString() ? '?' + params.toString() : ''), true);
  }
  window.clearSearch = clearSearch;

  function resetAll() {
    var input = document.getElementById('search-q');
    var btn = document.getElementById('clear-search-btn');
    if (input) input.value = '';
    if (btn) btn.style.display = 'none';
    refreshList(window.location.pathname, true);
  }
  window.resetAll = resetAll;

  function applyDateFilter() {
    var from = document.getElementById('filter-date-from');
    var to   = document.getElementById('filter-date-to');
    var params = new URLSearchParams(window.location.search);
    if (from && from.value) params.set('date_from', from.value); else params.delete('date_from');
    if (to && to.value) params.set('date_to', to.value); else params.delete('date_to');
    params.delete('page');
    refreshList(window.location.pathname + (params.toString() ? '?' + params.toString() : ''), true);
  }
  window.applyDateFilter = applyDateFilter;

  // Replie / déplie un groupe (en-tête cliquable, chevron qui pivote).
  function toggleGroup(id, headerEl) {
    var ouvert = !headerEl.classList.contains('open');
    headerEl.classList.toggle('open', ouvert);
    document.querySelectorAll('[data-group-id="' + id + '"]').forEach(function(el) {
      el.style.display = ouvert ? '' : 'none';
    });
  }
  window.toggleGroup = toggleGroup;

  // Menus déroulants
  // Referme aussi le constructeur de conditions : laissé déplié, il réapparaîtrait
  // ouvert à la prochaine ouverture du menu Filtres.
  function fermerMenus() {
    document.querySelectorAll('.o-dd-panel.open').forEach(function(p) { p.classList.remove('open'); });
    document.querySelectorAll('.lstf-ouvert').forEach(function(e) { e.classList.remove('lstf-ouvert'); });
    document.querySelectorAll('.lstg-ouvert').forEach(function(e) { e.classList.remove('lstg-ouvert'); });
  }

  function toggleDd(id, btn) {
    var panel = document.getElementById(id);
    if (!panel) return;
    var isOpen = panel.classList.contains('open');
    fermerMenus();
    if (!isOpen) {
      var rect = btn.getBoundingClientRect();
      panel.style.top  = (rect.bottom + 4) + 'px';
      panel.style.left = rect.left + 'px';
      panel.style.right = 'auto';
      panel.classList.add('open');
      var pr = panel.getBoundingClientRect();
      if (pr.right > window.innerWidth - 8) {
        panel.style.left  = 'auto';
        panel.style.right = (window.innerWidth - rect.right) + 'px';
      }
      // Place les sous-menus du bon côté : vers la gauche s'il ne reste pas la
      // largeur d'un sous-menu à droite du panneau. Le constructeur de conditions
      // est bien plus large que les autres, d'où le besoin mesuré au cas par cas.
      var restant = window.innerWidth - panel.getBoundingClientRect().right;
      var besoin = panel.querySelector('.lstf-panneau') ? 345
                 : panel.querySelector('.lstg-panneau') ? 265 : 180;
      panel.classList.toggle('vers-gauche', restant < besoin);
    }
  }
  window.toggleDd = toggleDd;

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.o-dd-wrap')) fermerMenus();
  });
  // Un menu est positionné en fixed : le défilement de la page le décrocherait de
  // son bouton, on le referme donc. Mais pas quand c'est l'intérieur d'un menu
  // qui défile — le constructeur de conditions se replierait en pleine saisie.
  document.addEventListener('scroll', function(e) {
    if (e.target && e.target.closest && e.target.closest('.o-dd-panel')) return;
    fermerMenus();
  }, true);

  // Liens ?page=... de la barre de contrôles : interceptés pour rester en AJAX.
  document.addEventListener('click', function(e) {
    var a = e.target.closest('#subheader-controls a[href^="?"]');
    if (!a) return;
    e.preventDefault();
    refreshList(a.getAttribute('href'), true);
  });

  window.addEventListener('popstate', function() {
    refreshList(window.location.pathname + window.location.search, false);
  });

  // ── Ouverture au survol des menus Filtres et Regrouper par ───────────────
  // Le clic reste opérant (seul recours au tactile) ; le survol ouvre en plus.
  // Fermeture différée : le panneau étant posé 4 px sous le bouton, la souris
  // doit pouvoir franchir cet espace sans que tout se referme.
  var DELAI_FERMETURE = 250;
  var MENUS_SURVOL = [['btn-filtres', 'dd-filtres'], ['btn-group', 'dd-group']];

  function brancherSurvolMenus() {
    MENUS_SURVOL.forEach(function(paire) {
      var btn = document.getElementById(paire[0]);
      var panneau = document.getElementById(paire[1]);
      if (!btn || !panneau) return;
      var wrap = btn.closest('.o-dd-wrap');
      if (!wrap || wrap.dataset.survolBranche) return;
      wrap.dataset.survolBranche = '1';
      var minuteur;
      wrap.addEventListener('mouseenter', function() {
        clearTimeout(minuteur);
        if (!panneau.classList.contains('open')) toggleDd(paire[1], btn);
      });
      // Réarmement plutôt qu'abandon : un champ du menu qui a le focus (liste
      // déroulante déployée, date en cours de saisie) ouvre une fenêtre du
      // système par-dessus, laquelle fait sortir le curseur du menu — refermer
      // perdrait la saisie. On reprogramme alors le contrôle plutôt que de
      // l'abandonner, sinon rendre le focus alors que la souris est déjà loin
      // laisserait le menu ouvert indéfiniment.
      //
      // Le seul fait qu'un panneau soit épinglé ne suffit pas à retenir le menu :
      // il restait autrement ouvert pour de bon dès qu'on avait effleuré
      // « Ajouter un filtre personnalisé ».
      function planifierFermeture() {
        minuteur = setTimeout(function () {
          if (panneau.contains(document.activeElement)) { planifierFermeture(); return; }
          panneau.classList.remove('open');
          // Les panneaux épinglés à l'intérieur perdent leur marque : sans cela
          // le menu se rouvrirait avec le constructeur de conditions déjà déplié.
          panneau.querySelectorAll('.lstf-ouvert, .lstg-ouvert').forEach(function (e) {
            e.classList.remove('lstf-ouvert');
            e.classList.remove('lstg-ouvert');
          });
        }, DELAI_FERMETURE);
      }
      wrap.addEventListener('mouseleave', function() {
        clearTimeout(minuteur);
        planifierFermeture();
      });
    });
  }
  window.brancherSurvolMenus = brancherSurvolMenus;
  // Filet après un échange AJAX : la barre de contrôles est remplacée, et son
  // nouveau conteneur n'appartient plus à la chaîne de survol du navigateur — il
  // ne reçoit donc aucun `mouseleave` quand la souris s'en va, si bien que le
  // menu rouvert restait ouvert jusqu'au clic suivant. Le document, lui, ne
  // change pas : c'est sur lui qu'on surveille le survol.
  var minuteurHorsMenu;
  document.addEventListener('mouseover', function (e) {
    if (!e.target.closest) return;
    clearTimeout(minuteurHorsMenu);
    if (e.target.closest('.o-dd-wrap')) return;
    minuteurHorsMenu = setTimeout(function () {
      var ouvert = document.querySelector('.o-dd-panel.open');
      // Un champ du menu a le focus : une fenêtre du système est peut-être
      // déployée par-dessus, refermer perdrait la saisie.
      if (!ouvert || ouvert.contains(document.activeElement)) return;
      fermerMenus();
    }, DELAI_FERMETURE);
  });

  brancherSurvolMenus();

  // Recherche : rafraîchit 300 ms après la dernière frappe.
  (function() {
    var input = document.getElementById('search-q');
    if (!input) return;
    var timer;
    input.addEventListener('input', function() {
      var btn = document.getElementById('clear-search-btn');
      if (btn) btn.style.display = input.value ? '' : 'none';
      clearTimeout(timer);
      var val = input.value;
      timer = setTimeout(function() {
        var params = new URLSearchParams(window.location.search);
        if (val) params.set('q', val); else params.delete('q');
        params.delete('page');
        refreshList(window.location.pathname + (params.toString() ? '?' + params.toString() : ''), true);
      }, 300);
    });
  })();
</script>
