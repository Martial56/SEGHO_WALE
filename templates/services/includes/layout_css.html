{% load static %}
<style>
  /* ══════════════════════════════════════════════════════════════
   CSS LAYOUT PARTAGÉ — MODULE services
   Inclus par : list, consommables_list, categories_list, unites_list
   ══════════════════════════════════════════════════════════════ */

  @import url('{% static "vendor/fonts/fonts.css" %}');

  :root {
    --primary: var(--teal-700);
    --primary-dark: var(--teal-700);
    --accent: var(--teal-500);
    --bg: #f9f9f9;
    --surface: #ffffff;
    --border: #d9d9d9;
    --text: #212529;
    --text-muted: #6c757d;
  }

  {% comment %}
  Le module ne redéfinit plus les surfaces ni les textes du thème sombre : ce
  bloc arrivant après celui de base.html, ses valeurs l'emportaient et le module
  apparaissait dans un bleu-violet (#21283a) différent du reste de l'application.
  En les laissant tomber, base.html reprend la main et le module porte la même
  palette que partout ailleurs. Seul --bg, propre au module, est déclaré ici, et
  il vise la même valeur que le fond des autres pages.
  {% endcomment %}
  html[data-theme="dark"] {
    --bg: var(--surface-muted);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-roboto);
    background: var(--bg) !important;
    color: var(--text);
  }

  html {
    background: var(--bg) !important;
  }

  .topbar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    z-index: 201 !important;
  }

  .breadcrumb {
    display: none !important;
  }

  .content {
    padding: 0 !important;
    overflow-x: hidden;
  }
  .o-list-wrap { margin: 0 !important; }

  /* .content n'a pas de padding → le margin: 0 -32px du subheader déborderait à gauche */
  .o-subheader {
    margin: 0 !important;
  }

  /* ── O-NAV ── */
  {% comment %}
  La barre de navigation du module n'a plus de styles propres : ils étaient une
  copie de static/css/global.css, mais avec d'autres couleurs de thème sombre
  (marque en blanc, onglet actif en --teal-100 souligné de gris). La barre du
  module ne portait donc pas l'accent du logiciel, contrairement à tous les
  autres modules. En laissant la feuille globale s'appliquer, .o-nav, .o-nav-grid,
  .o-nav-brand et .o-nav-link sont strictement identiques à ceux de Médecins.
  {% endcomment %}

  /* ── SUBHEADER ── */
  .o-subheader {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 6px 16px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .o-subheader-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .o-page-title {
    font-size: 17px;
    font-weight: 400;
    color: var(--text);
  }

  .o-page-count {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    margin-left: 3px;
  }

  html[data-theme="dark"] .o-subheader {
    background: var(--surface);
    border-bottom-color: var(--border);
  }

  /* ── BOUTON CRÉER ── */
  .o-btn-create {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 5px 14px;
    border-radius: 4px;
    font-size: 12.5px;
    font-weight: 500;
    font-family: var(--font-roboto);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    letter-spacing: 0.5px;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .o-btn-create:hover {
    background: var(--primary);
  }

  /* ── BARRE DE RECHERCHE ── */
  .o-search-bar {
    display: flex;
    align-items: center;
    border: none;
    border-bottom: 1px solid #bbb;
    background: transparent;
    min-height: 28px;
    padding: 2px 4px;
    gap: 4px;
    width: 280px;
  }

  .o-search-input {
    border: none;
    outline: none;
    font-size: 12px;
    font-family: var(--font-roboto);
    color: var(--text);
    flex: 1;
    min-width: 60px;
    background: transparent;
  }

  .o-search-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 13px;
    padding: 2px;
  }

  html[data-theme="dark"] .o-search-input {
    color: var(--text);
  }

  html[data-theme="dark"] .o-search-bar {
    border-bottom-color: var(--border-strong);
  }

  /* ── BOUTONS CONTRÔLE ── */
  .o-ctrl-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
    font-family: var(--font-roboto);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    white-space: nowrap;
    text-decoration: none;
  }

  .o-ctrl-btn:hover {
    border-color: var(--border);
    color: var(--text);
    background: #f3f3f3;
  }

  .o-ctrl-btn.active {
    border-color: var(--border-strong);
    color: var(--text);
    background: var(--surface-muted);
  }

  {# Sans cette variante, le bouton actif (Filtres ouvert, vue choisie) restait #}
  {# un aplat gris clair sur la barre sombre. #}
  html[data-theme="dark"] .o-ctrl-btn.active {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--border-strong);
  }

  html[data-theme="dark"] .o-ctrl-btn {
    color: var(--text-muted);
  }

  html[data-theme="dark"] .o-ctrl-btn:hover {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
  }

  .o-ctrl-sep {
    width: 1px;
    height: 18px;
    background: var(--border);
    margin: 0 3px;
    flex-shrink: 0;
  }

  html[data-theme="dark"] .o-ctrl-sep {
    background: var(--border);
  }

  /* ── TAGS FILTRES ── */
  {# La pastille de filtre actif était un aplat bleu clair codé en dur, avec sa #}
  {# croix en gris foncé : illisible en thème sombre. Fond et filet dérivés de #}
  {# l'accent, donc valables dans les deux thèmes. #}
  .o-filter-tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: rgba(var(--teal-500-rgb), 0.12);
    color: var(--accent-text);
    border: 1px solid rgba(var(--teal-500-rgb), 0.35);
    border-radius: 3px;
    padding: 1px 6px;
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
  }

  .o-filter-tag a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 14px;
    line-height: 1;
    margin-left: 2px;
  }

  .o-filter-tag a:hover {
    color: var(--text);
  }

  /* ── BOUTONS VUE ── */
  .o-view-btns {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .o-view-btn {
    width: 26px;
    height: 24px;
    border: none;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .o-view-btn:not(:last-child) {
    border-right: 1px solid var(--border);
  }

  .o-view-btn.active,
  .o-view-btn:hover {
    background: var(--primary);
    color: #fff;
  }

  html[data-theme="dark"] .o-view-btns {
    border-color: var(--border);
  }

  html[data-theme="dark"] .o-view-btn {
    background: var(--surface);
    color: var(--text-muted);
  }
  /* Sans ce rappel, la regle sombre ci-dessus (plus specifique que
     .o-view-btn.active) effacait la couleur du bouton de vue actif. */
  html[data-theme="dark"] .o-view-btn.active,
  html[data-theme="dark"] .o-view-btn:hover { background: var(--teal-600); color: #fff; }

  /* ── PAGINATION BAS ── */
  .o-pagination-bottom {
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
    padding: 14px 0;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }

  .o-pag-btn {
    width: 24px;
    height: 24px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .o-pag-btn:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--teal-700);
  }

  .o-pag-btn.disabled {
    opacity: 0.35;
    pointer-events: none;
  }

  html[data-theme="dark"] .o-pag-btn {
    background: var(--surface);
    border-color: var(--border);
    color: var(--text-muted);
  }

  /* ── VIDE ── */
  .o-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .o-empty i {
    font-size: 36px;
    display: block;
    margin-bottom: 10px;
    opacity: 0.5;
  }

  /* ── TRI + REDIMENSIONNEMENT COLONNES (partagé) ── */
  .o-list-table th {
    position: relative;
    user-select: none;
  }

  .sortable {
    cursor: pointer;
  }

  .sortable:hover {
    background: rgba(0, 0, 0, 0.025) !important;
  }

  html[data-theme="dark"] .sortable:hover {
    background: rgba(255, 255, 255, 0.04) !important;
  }

  .sort-icon {
    font-size: 10px;
    color: var(--accent-text-soft);
    margin-left: 4px;
    vertical-align: middle;
    opacity: 0.85;
  }

  .col-resizer {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    width: 5px;
    cursor: col-resize;
    z-index: 2;
  }

  .col-resizer:hover,
  .col-resizer.resizing {
    background: var(--accent);
    opacity: 0.45;
  }

</style>
