<script>
(function () {
  var hrefPrecedent = "{{ href_precedent|default:''|escapejs }}" || null;
  var hrefSuivant = "{{ href_suivant|default:''|escapejs }}" || null;

  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '';
    if (['INPUT', 'TEXTAREA', 'SELECT'].indexOf(tag) !== -1) return;

    if (e.key === 'ArrowLeft' && hrefPrecedent) {
      window.location.href = hrefPrecedent;
    } else if (e.key === 'ArrowRight' && hrefSuivant) {
      window.location.href = hrefSuivant;
    }
  });
})();
</script>
