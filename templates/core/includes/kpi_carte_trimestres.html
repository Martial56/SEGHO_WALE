<div class="kpi-card">
  <div class="kpi-card-head"><span class="kpi-card-title">{{ titre }}</span><span class="kpi-card-total">{{ total }}</span></div>
  <span class="kpi-trims-label">Trimestres {{ annee }}</span>
  <div class="kpi-trims">
    {% for t in serie.trimestres %}<span title="{% cycle 'janvier – mars' 'avril – juin' 'juillet – septembre' 'octobre – décembre' %}"><b>T{{ forloop.counter }} :</b> {{ t }}</span>{% endfor %}
  </div>
</div>
